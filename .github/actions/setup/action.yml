name: Set up
description: Installs Node and the pinned Compact compiler, and verifies the compiler.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - name: Install Compact
      shell: bash
      env:
        COMPACT_TOOL_VERSION: 0.5.1
        COMPACT_TOOL_SHA256: 684c6b3d2eef9484aabba7a0820c166ae5c169f3aecf28cbea2074840263ba66
      run: |
        archive=compact-x86_64-unknown-linux-musl.tar.xz
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/midnightntwrk/compact/releases/download/compact-v${COMPACT_TOOL_VERSION}/${archive}"
        echo "${COMPACT_TOOL_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar -xJf "$archive" --strip-components=1 -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/compact" update 0.35.0 --no-set-default
    # compact update can't check a checksum, so verify what it installed before running it.
    # zkir rejects proving parameters whose hash doesn't match, so they need no pin here.
    - name: Verify the Compact compiler
      shell: bash
      run: |
        cd "$HOME/.compact/versions/0.35.0/x86_64-unknown-linux-musl"
        sha256sum -c - <<'EOF'
        15646793d3ff7f36cd81aa63419163e29d9893538bb4a6911a21012e8735b537  compactc
        5f7e2f0e2da785f1f88d231c8d78a4f98278ddf370deac9de805b2c0e267c910  compactc.bin
        f2a3fd10169da6642ddc56d65c8a6b634637c6222aa0a39152b2ea92c6553a8f  zkir
        5cf6bce84375a5281c2814fa9084325ba3962769f16611cf8150690033bb1cb7  zkir-v3
        EOF
